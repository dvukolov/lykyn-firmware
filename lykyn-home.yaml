
external_components:
  - source:
      type: local
      path: external_components
    components: [shroom_labs_cloud, lykyn_dashboard, shroom_labs_local_api]

# Build with your own WiFi baked in. Uses secrets.yaml (git ignored).
packages:
  core: !include lykyn-core.yaml
  web: !include lykyn-web.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  # No reboot on a Wi-Fi outage (ESPHome's default reboots after 15 min). Climate control is local,
  # and an external controller's lease expires on its own, so the chamber falls back to SMART anyway.
  reboot_timeout: 0s
  ap:
    ssid: "Lykyn-Setup"
    password: !secret ap_password

web_server:
  port: 80
  version: 3
  include_internal: false
  auth:
    username: !secret web_username
    password: !secret web_password

ota:
  # An upload blocks the main loop, so nothing could end a mist or a fan pulse during it. Switch
  # everything off first, and leave EXTERNAL for the SMART fallback in case the upload fails.
  # Only native OTA: web OTA runs its begin hook on a later loop, so the climate loop could restart
  # the outputs during the upload (Codex review, 2026-11-23). Updates go through `esphome upload`.
  - platform: esphome
    password: !secret ota_password
    on_begin:
      - script.execute: ota_stop_outputs
